name: Validate AKS bundle

on:
  pull_request:
    paths:
      - "azure-aks-ops/**"
      - "azure-ops/SKILL.md"
      - ".github/aks-upstream/**"
      - ".github/workflows/*aks*.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install pinned development checks
        run: |
          python3 -m venv "$RUNNER_TEMP/aks-dev"
          "$RUNNER_TEMP/aks-dev/bin/python" -m pip install -r .github/aks-upstream/requirements.txt
      - name: Lint, formatting and typecheck
        run: |
          "$RUNNER_TEMP/aks-dev/bin/ruff" check .github/aks-upstream
          "$RUNNER_TEMP/aks-dev/bin/ruff" format --check .github/aks-upstream
          "$RUNNER_TEMP/aks-dev/bin/mypy" .github/aks-upstream/*.py
      - name: Offline integrity and regression tests
        run: |
          python3 .github/aks-upstream/validate_aks_bundle.py
          python3 -m unittest discover -s .github/aks-upstream/tests -v
          python3 -m unittest discover -s azure-ops/tests -v
          git diff --check
      - name: Verify reproducibility against pinned upstream commit
        run: python3 .github/aks-upstream/sync_aks_upstream.py --check
